services:
  - type: web
    name: clish-photos-booking
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
